name: Deploy Mini App

# Nahrazuje výchozí "legacy" build Pages, který se pouštěl při KAŽDÉM pushi
# do main — tedy i při commitu stavu po 5 minutách (86 buildů/24 h, většina
# zbytečně zrušených). Tady se Pages přestaví jen při změně samotné aplikace.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
